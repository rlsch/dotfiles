##############
#            #
#   BASICS   #
#            #
##############
#
# C- "press and hold the Ctrl key"
# M-  means Meta key which is Alt on most keyboards
# S-  Shift key
# 
# Windows
# ----------
# Prefix c        - create window
# Prefix ,        - Name window
# Prefix <number> - switch to Windows Number <number>
# Prefix &        - kill window
#
# Panes
# --------
# Prefix z  - make a pane go fullscreen
# Prefix q  - display panes (numbers in pane)
# Prefix x  - kill pane
# 
# Session handling
# -----------------
# prefix d                - detach from session
# tmux ls                 - list sessions
# tmux attach -t <session name>
# tmux kill-session -t <session-name>
# tmux new -s <session-name>
# tmux rename-session -t <old name> <new name>
# (same as Prefix $)
# Prefix s                - choose session (switch between sessions)
# 
# Copy and paste
# --------------
# Prefix [    - copy-mode
# Space       - begin selection (arrow keys)
# Enter       - copy selection 
# Prefix ]    - paste selection
# 
# Plugins
# -------------
# Prefix I     - Installs new plugin, refreshes tmux session
# Prefix U     - Updates plugin(s)
# Prefix Alt U - Remove/uninstall plugins not on the plugin list
#####################

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

set -g status-keys vi
setw -g mode-keys vi
set -g history-limit 10000

set -g mouse on

# Reload tmux config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g display-time 3000
set -g escape-time 0
set -g base-index 1
set -g pane-base-index 1

bind y run-shell "tmux show-buffer | xclip -sel clip -i > /dev/null && tmux display-message 'buffer copied to clipboard'"
#set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# Automatically put tmux buffer into clipboard after Enter or after Mouse copy action
bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "xsel -i --clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel -i --clipboard"

################
###  Windows ###
################
# don't rename windows automatically
set-option -g allow-rename off

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

#############
### Panes ###
#############
bind | split-window -h
bind - split-window -v
bind + split-window -h \; split-window -v \; select-pane -U \; select-pane -L \; split-window -v
unbind '"'
unbind %

bind J resize-pane -D 5
bind K resize-pane -U 5
bind H resize-pane -L 5
bind L resize-pane -R 5

bind M-j resize-pane -D
bind M-k resize-pane -U
bind M-h resize-pane -L
bind M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# write text to all panes in window
bind a set-window-option synchronize-panes

######################
### DESIGN CHANGES ###
######################

# colours:
# for i in {0..255}; do
#    printf "\x1b[38;5;${i}mcolour${i}\x1b[0m\n"
# done

# loud or quiet?
set-option -g visual-activity on
set-option -g visual-bell on
set-option -g visual-silence on
set-window-option -g monitor-activity on
set-option -g bell-action none

# Set the default terminal mode to 256color mode
set -g default-terminal screen-256color

# modes (highlighting text, and counter in the top right corner)
setw -g clock-mode-colour colour135
# red text on dark grey background
setw -g mode-style bold,fg=colour196,bg=colour238

# panes
# dark grey on an even darker grey bg
set -g pane-border-style fg=colour238,bg=colour235
# bright green on dark grey
set -g pane-active-border-style fg=colour2,bg=colour236

# statusbar
#(date) shell command
#I      window index
#S      session name
#W      window name
#F      window flags
#H      Hostname
#h      Hostname, short
#D      pane id
#P      pane index
#T      pane title

set -g status-justify centre # Center the window list
set -g status-position bottom
set -g status-interval 2 # update every 2 seconds
# white text on dark grey bg
set -g status-style fg=white,bg=colour236,none

set -g status-left  "#[fg=colour1]⚒ "
set -ag status-left "#[fg=green]#{host}"
set -ag status-left "#[fg=colour208] (#S) "
set -ag status-left "#[fg=colour45]w#I.p#P"
set -ag status-left "#[fg=colour1]⚒"
set -g status-left-length 60
set -g status-left-style bright

## Right side
#set -g status-right " #[fg=#2579a4]#{pane_title}#[default] >> #[fg=#587785]#{pane_current_command} "
set -g status-right " #[fg=#587785]#{pane_current_command} "
#set -g status-right " #[fg=#2579a4]#{pane_title} "
# Windows and clients
set -ag status-right '#[default]W:#{session_windows} '
set -ag status-right 'Clients: #{session_attached} '
# CPU and Memory
#set -ag status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] '
# https://github.com/thewtex/tmux-mem-cpu-load
#set -ag status-right '#[fg=colour226]#(tmux-mem-cpu-load --graph-lines 0 --interval 2)#[default] '
set -ag @sysstat_mem_view_tmpl '#[fg=#{mem.color}]#{mem.used}#[default]/#{mem.total} '
set -ag @sysstat_mem_size_unit "G"
set -ag status-right "#{sysstat_mem}"
set -ag status-right '#{cpu_fg_color}#{cpu_percentage} '
# Date and Time
set -ag status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 100
set -g status-right-style dim

setw -g window-status-separator ' '

# 4:name[2]
#-3:name[4]-
# dim redish on dark grey bg
setw -g window-status-style fg=colour138,bg=colour236,none
setw -g window-status-format "#[fg=colour244]#F#[fg=default]#I:#[fg=colour250]#W#[fg=#587785][#{window_panes}]#[fg=colour244]#F"
#244 grey 250 light grey 

# *1:name*
# dark red on grey bg
setw -g window-status-current-style bold,fg=colour1,bg=colour236
setw -g window-status-current-format '#F#I:#[fg=colour118]#W#[fg=colour1]#F'
# 118 green

# -3:name[4]-
# dim redish on grey bg
setw -g window-status-activity-style fg=colour138,bg=colour237,none
#setw -g window-status-activity-format '#F#I:#W#F'

# bold white on dark red bg
setw -g window-status-bell-style bold,fg=colour255,bg=colour1

# messages
set -g message-style bold,fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black

#######################
# Tmux Plugin Manager #
#######################
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# https://github.com/tmux-plugins/tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @resurrect-save-command-strategy 'pgrep'
set -g @resurrect-processes 'nano'
set -g @resurrect-capture-pane-contents 'on'
# Prefix + Ctrl-s - save
# Prefix + Ctrl-r - restore

# https://github.com/tmux-plugins/tmux-cpu
set -g @plugin 'tmux-plugins/tmux-cpu'

# https://github.com/samoshkin/tmux-plugin-sysstat
set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# https://github.com/tmux-plugins/tmux-continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# https://github.com/tmux-plugins/tmux-yank
#set -g @plugin 'tmux-plugins/tmux-yank'
# prefix–y — copies text from the command line to the clipboard.
# prefix–Y — copy the current pane's current working directory to the clipboard.

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
